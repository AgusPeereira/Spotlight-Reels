<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="color-scheme" content="dark" />

    <title>Spotlight Reels | Soccer Recruiting Highlight Videos</title>
    <meta
      name="description"
      content="Recruiting highlight videos for soccer players, built for what college coaches actually watch. Ready in 48 hours."
    />

    <!-- Íconos -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Imagen y texto al compartir el link (WhatsApp, Instagram, email).
         %SITE_URL% se reemplaza solo con la URL de src/config/site.ts -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spotlight Reels" />
    <meta property="og:title" content="Spotlight Reels | Soccer Recruiting Highlight Videos" />
    <meta
      property="og:description"
      content="Recruiting highlight videos built for what college coaches actually watch. Ready in 48 hours."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image-1200x630.png" />

    <!-- Las tipografías se cargan desde la propia web (ver src/main.tsx) -->

    <!--
      ANALÍTICA (desactivada por ahora).
      Cuando quieras medir visitas, pegá acá el código de Google Analytics
      o del píxel de Meta. Ojo: esas herramientas usan cookies, así que
      vas a necesitar agregar un banner de consentimiento y actualizar
      la política de privacidad.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
